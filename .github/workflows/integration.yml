name: integration

# Integration tests against a real local Canton node. Heavier than the unit-test
# gate (boots Canton), so it runs on demand and on pushes to main.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out this package
        uses: actions/checkout@v4

      - name: Check out dpm-trace
        uses: actions/checkout@v4
        with:
          repository: walnuthq/dpm-trace
          path: dpm-trace
      - uses: actions/setup-go@v5
        with:
          go-version-file: dpm-trace/go.mod
      # dpm-trace is a Go binary now; build it once and put it on PATH.
      - name: Build dpm-trace
        run: |
          go build -C dpm-trace -o "$RUNNER_TEMP/dpm-trace" ./cmd/dpm-trace
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Daml SDK (includes the Canton jar)
        run: |
          curl -sSL https://get.daml.com/ | sh -s 3.4.11
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Install lit + FileCheck
        run: |
          python3 -m pip install --user lit
          sudo apt-get update && sudo apt-get install -y llvm
          command -v FileCheck || sudo ln -sf \
            "$(find /usr/lib -path '*/llvm-*/bin/FileCheck' -type f -print -quit)" \
            /usr/local/bin/FileCheck

      - name: Run integration suite (managed Canton)
        run: |
          dpm-trace test . \
            --integration itests \
            --canton-jar "$HOME/.daml/sdk/3.4.11/canton/canton.jar" \
            --daml daml \
            --parties Alice@1,Bob@2,Issuer@1 \
            --verbose \
            --color always

      - name: Failure demo (source-mapped, non-gating)
        continue-on-error: false
        run: |
          dpm-trace test . \
            --integration itests/demos \
            --canton-jar "$HOME/.daml/sdk/3.4.11/canton/canton.jar" \
            --daml daml \
            --parties Alice@1,Bob@2,Issuer@1 \
            --verbose \
            --color always

